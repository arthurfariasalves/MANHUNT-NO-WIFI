name: Gerar APK Manhunt
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Configurar Capacitor
        run: npm init -y && npm install @capacitor/core @capacitor/cli @capacitor/android && npx cap init "Manhunt" "com.manhunt.offline" --web-dir=www && npx cap add android
      - name: Adicionar Permissoes Android
        run: sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE" \/><uses-permission android:name="android.permission.CHANGE_WIFI_STATE" \/><uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" \/><uses-permission android:name="android.permission.BLUETOOTH" \/><uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/><uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" \/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/><uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>/' android/app/src/main/AndroidManifest.xml && npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Baixar APK
        uses: actions/upload-artifact@v4
        with:
          name: Manhunt-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
