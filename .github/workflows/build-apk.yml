name: Gerar APK Manhunt
on:
workflow_dispatch:
push:
branches: [ main ]
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: 20
- uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
- name: Configurar Capacitor
run: |
npm init -y
npm install @capacitor/core @capacitor/cli @capacitor/android
npx cap init "Manhunt" "com.manhunt.offline" --web-dir=www
npx cap add android
- name: Adicionar Permissões Wi-Fi Direct e GPS
run: |
sed -i 's/<uses-permission android:name="android.permission.INTERNET" />/<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />/' android/app/src/main/AndroidManifest.xml
npx cap sync android
- name: Compilar APK
run: |
cd android
chmod +x gradlew
./gradlew assembleDebug
- name: Disponibilizar APK para Download
uses: actions/upload-artifact@v4
with:
name: Manhunt-APK
path: android/app/build/outputs/apk/debug/app-debug.apk
