        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-text">Atualizado</span>

    <script>
        /**
         * ============================================================================
         * 1. CÁLCULOS GEODÉSICOS REAIS (GPS -> DISTÂNCIA EM METROS E ÂNGULO NO RADAR)
         * ============================================================================
         */
        const GeoMath = {
            getDistanceMeters(lat1, lon1, lat2, lon2) {
                const R = 6371e3;
                const rad = Math.PI / 180;
                const dLat = (lat2 - lat1) * rad;
                const dLon = (lon2 - lon1) * rad;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                          Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                          Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            },

            getBearingDegrees(lat1, lon1, lat2, lon2) {
                const rad = Math.PI / 180;
                const y = Math.sin((lon2 - lon1) * rad) * Math.cos(lat2 * rad);
                const x = Math.cos(lat1 * rad) * Math.sin(lat2 * rad) -
                          Math.sin(lat1 * rad) * Math.cos(lat2 * rad) * Math.cos((lon2 - lon1) * rad);
                const brng = Math.atan2(y, x) * (180 / Math.PI);
                return (brng + 360) % 360;
            }
        };

        /**
         * ============================================================================
         * 2. PONTE NATIVA P2P (WI-FI DIRECT / GOOGLE NEARBY CONNECTIONS)
         * ============================================================================
         */
        class P2PNetworkBridge {
            constructor() {
                this.isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
                this.nativePlugin = null;
                this.serviceId = 'com.manhunt.offline.p2p';
                this.connectedEndpoints = new Set();
            }

            async init() {
                const dot = document.getElementById('p2p-dot');
                const label = document.getElementById('p2p-mode-label');

                if (this.isNativeApp) {
                    this.nativePlugin = window.Capacitor.Plugins.NearbyConnections || window.Capacitor.Plugins.WifiDirect;
                    
                    if (this.nativePlugin) {
                        dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                        label.innerText = 'Wi-Fi Direct Ativo';
                        await this.startNativeMesh();
                        return true;
                    }
                }

                // Se aberto fora do APK (no navegador), informa que a antena nativa aguarda empacotamento
                dot.className = 'w-2.5 h-2.5 rounded-full bg-zinc-500';
                label.innerText = 'Antena P2P Offline (Web)';
                return false;
            }

            async startNativeMesh() {
                try {
                    // 1. Quando outro celular aceita conexão, guarda o ID do aparelho
                    this.nativePlugin.addListener('onConnectionResult', (event) => {
                        if (event.status === 'CONNECTED') {
                            this.connectedEndpoints.add(event.endpointId);
                            showToast('Novo jogador conectado via Wi-Fi Direct!', 'fa-wifi text-emerald-400');
                        }
                    });

                    // 2. Quando outro celular envia um pacote JSON (coordenadas ou captura)
                    this.nativePlugin.addListener('onPayloadReceived', (event) => {
                        try {
                            const data = JSON.parse(event.payload);
                            app.onReceivePeerPacket(event.endpointId, data);
                        } catch (e) {
                            console.error('Erro ao ler pacote P2P:', e);
                        }
                    });

                    // 3. Aceita automaticamente qualquer celular com o mesmo App aberto perto de você
                    this.nativePlugin.addListener('onConnectionInitiated', async (event) => {
                        await this.nativePlugin.acceptConnection({ endpointId: event.endpointId });
                    });

                    // 4. Descobriu um celular próximo -> pede conexão imediatamente
                    this.nativePlugin.addListener('onEndpointFound', async (event) => {
                        await this.nativePlugin.requestConnection({
                            name: app.state.username,
                            endpointId: event.endpointId
                        });
                    });

                    // 5. Jogador saiu de alcance (>100m) ou fechou o app
                    this.nativePlugin.addListener('onEndpointLost', (event) => {
                        this.connectedEndpoints.delete(event.endpointId);
                        app.removePeer(event.endpointId);
                    });

                    // 6. Liga o anúncio (Advertising) e a busca (Discovery) ao mesmo tempo (Malha P2P_CLUSTER)
                    await this.nativePlugin.startAdvertising({
                        name: app.state.username,
                        serviceId: this.serviceId,
                        strategy: 'P2P_CLUSTER'
                    });

                    await this.nativePlugin.startDiscovery({
                        serviceId: this.serviceId,
                        strategy: 'P2P_CLUSTER'
                    });
                } catch (err) {
                    showToast('Permita Localização, Wi-Fi e Dispositivos Próximos', 'fa-triangle-exclamation text-amber-400');
                }
            }

            // Envia dados via Wi-Fi Direct para todos os celulares conectados
            async broadcastState(payloadObj) {
                if (this.isNativeApp && this.nativePlugin && this.connectedEndpoints.size > 0) {
                    const jsonString = JSON.stringify(payloadObj);
                    await this.nativePlugin.sendPayload({
                        endpointIds: Array.from(this.connectedEndpoints),
                        payload: jsonString
                    });
                }
            }
        }

        /**
         * ============================================================================
         * 3. CONTROLADOR PRINCIPAL DO JOGO MANHUNT (100% REAL, SEM BOTS)
         * ============================================================================
         */
        const app = {
            bridge: new P2PNetworkBridge(),
            state: {
                myId: 'PLAYER-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
                username: 'Jogador',
                role: 'runner', // 'runner' | 'hunter'
                status: 'active', // 'active' | 'captured'
                maxRange: 100, // metros
                captureRadius: 15, // metros
                coords: null, // Inicia nulo até o GPS real travar satélite
                secondsElapsed: 0,
                peers: new Map() // Apenas jogadores reais conectados via P2P
            },

            async init() {
                await this.bridge.init();
                requestRealGPS(); // Já inicia a busca de satélites GPS automaticamente

                // Transmite sua posição real a cada 1.5s para os aparelhos pareados
                setInterval(() => {
                    if (this.state.coords) {
                        this.broadcastMyLocation();
                    }
                    this.render();
                }, 1500);

                // Cronômetro da partida
                setInterval(() => {
                    this.state.secondsElapsed++;
                    const m = String(Math.floor(this.state.secondsElapsed / 60)).padStart(2, '0');
                    const s = String(this.state.secondsElapsed % 60).padStart(2, '0');
                    document.getElementById('match-timer').innerText = `${m}:${s}`;
                }, 1000);

                this.render();
            },

            broadcastMyLocation() {
                if (!this.state.coords) return;
                const packet = {
                    type: 'SYNC',
                    id: this.state.myId,
                    name: this.state.username,
                    role: this.state.role,
                    status: this.state.status,
                    lat: this.state.coords.lat,
                    lon: this.state.coords.lon,
                    ts: Date.now()
                };
                this.bridge.broadcastState(packet);
            },

            onReceivePeerPacket(endpointId, packet) {
                if (packet.type === 'CAPTURE_EVENT' && packet.targetId === this.state.myId) {
                    this.state.status = 'captured';
                    showToast(`Você foi capturado por ${packet.hunterName}!`, 'fa-hand text-red-400');
                    this.render();
                    return;
                }

                if (packet.type === 'SYNC') {
                    this.state.peers.set(endpointId, {
                        id: packet.id || endpointId,
                        endpointId: endpointId,
                        name: packet.name || 'Jogador',
                        role: packet.role || 'runner',
                        status: packet.status || 'active',
                        lat: packet.lat,
                        lon: packet.lon,
                        lastSeen: Date.now()
                    });
                    this.render();
                }
            },

            removePeer(endpointId) {
                this.state.peers.delete(endpointId);
                this.render();
            },

            render() {
                const pinsLayer = document.getElementById('peers-pins-layer');
                const listContainer = document.getElementById('peers-list');
